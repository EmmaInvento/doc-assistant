[project]
name = "doc-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.31.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13"]
build-backend = "uv_build"
